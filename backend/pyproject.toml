[project]
name = "open-sync"
version = "0.2.0"
description = "Sync MCP servers, skills, rules, commands and subagents across AI coding tools"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.3",
    "httpx>=0.27.0",
    "tomlkit>=0.13.0",
    "websockets>=13.0",
]

[project.urls]
Repository = "https://github.com/brandon-braner/open_sync"

[project.scripts]
opensync = "opensync.cli:main"
open-sync = "opensync.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]

[tool.hatch.build.targets.wheel]
packages = ["opensync"]

[tool.hatch.build.targets.sdist]
include = ["opensync", "hatch_build.py", "README.md"]

# Bundles frontend/dist into the package as opensync/static (see hatch_build.py).
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist.hooks.custom]
path = "hatch_build.py"
